[mcp_servers.yahoo-mail]
command = "node"
args = [
  "REPLACE_WITH_ABSOLUTE_REPOSITORY_PATH/dist/apps/local-connector/src/stdio.js",
  "--provider=fake",
]
env_vars = ["DBUS_SESSION_BUS_ADDRESS", "XDG_RUNTIME_DIR"]
enabled = true
required = false
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 60
